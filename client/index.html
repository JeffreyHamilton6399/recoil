<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140e38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="RECOIL: a two-player arena duel where the only way to move is to shoot." />
    <title>RECOIL</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23bfe0f5'/%3E%3Crect x='16' y='13' width='13' height='6' rx='2' fill='%23222a44'/%3E%3Ccircle cx='14' cy='16' r='9' fill='%23ff4d5e'/%3E%3C/svg%3E"
    />
    <style>
      /* Toon / comic look: flat colours, thick ink outlines, hard offset shadows. */
      :root {
        --ink: #1b1030;
        --paper: #fff6e0;
        --paper-2: #ffe9b8;
        --red: #ff5a5f;
        --red-dark: #c22f4c;
        --blue: #4d8bff;
        --sky: #7fd8ff;
        --yellow: #ffd93d;
        --muted: #6b5f86;
        --font: 'Arial Black', 'Arial Rounded MT Bold', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
        --body: 'Trebuchet MS', 'Helvetica Neue', Helvetica, system-ui, sans-serif;
        font-family: var(--body);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #140e38;
        color: var(--ink);
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      .hidden {
        display: none !important;
      }
      button {
        font: inherit;
        color: inherit;
      }

      /* Menu ------------------------------------------------------------ */
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        /* Comic halftone dots, generated in CSS. */
        background:
          radial-gradient(circle, rgba(255, 255, 255, 0.07) 1.6px, transparent 1.8px) 0 0 / 16px 16px,
          rgba(20, 14, 56, 0.55);
        overflow-y: auto;
      }
      .panel {
        position: relative;
        width: min(400px, 100%);
        margin-top: 44px;
        padding: 22px 22px 18px;
        border: 4px solid var(--ink);
        border-radius: 20px;
        background: var(--paper);
        box-shadow: 9px 9px 0 var(--ink);
        text-align: center;
      }
      .logo {
        margin: -58px 0 4px;
        font-family: var(--font);
        font-size: clamp(54px, 15vw, 78px);
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 1;
        color: var(--yellow);
        -webkit-text-stroke: 4px var(--ink);
        paint-order: stroke fill;
        text-shadow: 6px 6px 0 var(--ink);
        transform: rotate(-4deg);
      }
      .tag {
        margin: 10px 0 20px;
        color: var(--muted);
        line-height: 1.45;
        font-size: 15px;
        font-weight: 700;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 13px 18px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: var(--sky);
        color: var(--ink);
        font-family: var(--font);
        font-size: 18px;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 6px 0 var(--ink);
        transition: transform 0.06s ease, box-shadow 0.06s ease;
      }
      .btn:hover {
        filter: brightness(1.06);
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--ink);
      }
      .btn:disabled {
        opacity: 0.7;
        cursor: default;
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--ink);
      }
      .btn.primary {
        background: var(--red);
        color: #fff;
        -webkit-text-stroke: 1.5px var(--ink);
        paint-order: stroke fill;
        margin-bottom: 10px;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        color: var(--muted);
        font-size: 15px;
        text-decoration: underline;
        text-underline-offset: 4px;
        margin-top: 4px;
      }
      .or {
        margin: 18px 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
      .join {
        display: flex;
        gap: 10px;
      }
      .join input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: #fff;
        color: var(--ink);
        font-family: var(--font);
        font-size: 24px;
        letter-spacing: 0.3em;
        text-align: center;
        text-transform: uppercase;
        box-shadow: inset 0 4px 0 rgba(27, 16, 48, 0.12);
        -webkit-user-select: text;
        user-select: text;
      }
      .join input::placeholder {
        color: #c8bfdc;
      }
      .join input:focus {
        outline: 3px solid var(--yellow);
        outline-offset: 2px;
      }
      .join .btn {
        width: auto;
        padding: 10px 18px;
        background: var(--yellow);
      }
      .error {
        min-height: 1.3em;
        margin: 12px 0 0;
        color: var(--red-dark);
        font-size: 14px;
        font-weight: 800;
      }
      .help {
        margin-top: 12px;
        padding-top: 14px;
        border-top: 3px dashed rgba(27, 16, 48, 0.2);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        line-height: 2;
      }
      kbd {
        display: inline-block;
        min-width: 1.7em;
        padding: 0 5px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-family: var(--font);
        font-size: 11px;
        line-height: 1.5;
        box-shadow: 0 2px 0 var(--ink);
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }
      .code {
        display: inline-block;
        margin: 8px 0 10px;
        padding: 4px 14px 4px 26px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: var(--yellow);
        box-shadow: 5px 5px 0 var(--ink);
        font-family: var(--font);
        font-size: 56px;
        letter-spacing: 0.22em;
        transform: rotate(-2deg);
      }
      .url {
        margin: 6px 0 16px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 700;
        word-break: break-all;
        -webkit-user-select: all;
        user-select: all;
      }
      .waiting {
        margin: 16px 0 0;
        color: var(--muted);
        font-weight: 800;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 8px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--yellow);
        animation: bob 0.9s steps(2, jump-none) infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-4px);
        }
      }

      /* HUD ------------------------------------------------------------- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hud-btn {
        pointer-events: auto;
        width: 40px;
        height: 40px;
        border: 3px solid var(--ink);
        border-radius: 12px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        font-size: 16px;
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .hud-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      #btn-leave {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
      }
      #hud-right {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #room-tag,
      #ping {
        padding: 5px 9px;
        border: 3px solid var(--ink);
        border-radius: 10px;
        background: var(--paper);
        box-shadow: 3px 3px 0 var(--ink);
        font-family: var(--font);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
        color: var(--ink);
      }
      #ping[data-q='good'] {
        background: #9ff0b8;
      }
      #ping[data-q='ok'] {
        background: var(--yellow);
      }
      #ping[data-q='bad'] {
        background: #ffb0b5;
      }
      #btn-mute svg {
        width: 18px;
        height: 18px;
      }
      #btn-mute .x {
        display: none;
      }
      #btn-mute.muted .x {
        display: inline;
      }
      #btn-mute.muted .wave {
        display: none;
      }
      #banner {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%) rotate(-2deg);
        max-width: calc(100% - 32px);
        padding: 12px 18px;
        border: 3px solid var(--ink);
        border-radius: 14px;
        background: var(--yellow);
        box-shadow: 6px 6px 0 var(--ink);
        font-family: var(--font);
        font-size: 16px;
        text-align: center;
        pointer-events: none;
      }
      #match-end {
        position: fixed;
        left: 50%;
        top: 58%;
        transform: translateX(-50%);
        width: min(320px, calc(100% - 32px));
      }
      #match-end .btn.ghost {
        color: #fff;
      }

      /* Touch controls -------------------------------------------------- */
      #touch {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .tbtn {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
        display: grid;
        place-items: center;
        border: 4px solid var(--ink);
        border-radius: 50%;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        box-shadow: 0 7px 0 var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      .tbtn.pressed {
        transform: translateY(5px);
        box-shadow: 0 2px 0 var(--ink);
        background: var(--sky);
      }
      .aim {
        width: 80px;
        height: 80px;
        font-size: 28px;
        bottom: max(26px, env(safe-area-inset-bottom));
      }
      #t-left {
        left: max(16px, env(safe-area-inset-left));
      }
      #t-right {
        left: calc(max(16px, env(safe-area-inset-left)) + 92px);
      }
      .fire {
        width: 132px;
        height: 132px;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        font-size: 24px;
        letter-spacing: 0.04em;
        background: var(--red);
        color: #fff;
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
      }
      .fire.pressed {
        background: var(--yellow);
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="RECOIL arena"></canvas>

    <div id="hud" class="hidden">
      <button id="btn-leave" class="hud-btn" aria-label="Leave game" title="Leave">✕</button>
      <div id="hud-right">
        <span id="room-tag"></span>
        <span id="ping" data-q="bad">– ms</span>
        <button id="btn-mute" class="hud-btn" aria-label="Mute" title="Mute (M)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" />
            <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
            <path class="x" d="m16 9 6 6m0-6-6 6" />
          </svg>
        </button>
      </div>
    </div>

    <div id="banner" class="hidden"></div>

    <section id="menu" class="overlay">
      <div class="panel">
        <h1 class="logo">RECOIL</h1>
        <p class="tag">You can't walk. Every shot kicks you backwards.<br />Knock your rival off the shrinking ice.</p>

        <div id="menu-home">
          <button id="btn-create" class="btn primary">Create game</button>
          <div class="or">or join with a code</div>
          <form id="join-form" class="join">
            <input id="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" aria-label="Room code" />
            <button class="btn" type="submit">Join</button>
          </form>
          <p id="menu-error" class="error" role="alert"></p>
          <div class="help">
            Aim <kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd><br />
            Hold <kbd>Space</kbd>, <kbd>W</kbd> or <kbd>↑</kbd> to charge, release to fire<br />
            First to 5 knockouts wins
          </div>
        </div>

        <div id="menu-lobby" class="hidden">
          <div class="label">Room code</div>
          <div id="lobby-code" class="code">----</div>
          <div id="lobby-url" class="url"></div>
          <button id="btn-copy" class="btn primary">Copy link</button>
          <p class="waiting"><span class="dot"></span>Waiting for an opponent…</p>
          <button id="btn-lobby-leave" class="btn ghost">Leave</button>
        </div>
      </div>
    </section>

    <section id="match-end" class="hidden">
      <button id="btn-rematch" class="btn primary">Rematch</button>
      <button id="btn-menu" class="btn ghost">Back to menu</button>
    </section>

    <div id="touch" class="hidden">
      <div id="t-left" class="tbtn aim" role="button" aria-label="Aim left">◀</div>
      <div id="t-right" class="tbtn aim" role="button" aria-label="Aim right">▶</div>
      <div id="t-fire" class="tbtn fire" role="button" aria-label="Hold to charge, release to fire">FIRE</div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
